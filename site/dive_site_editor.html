<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dive Drop-Site Editor — Sodwana Bay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="vendor/maplibre-gl.css" rel="stylesheet"
        onerror="this.onerror=null;this.href='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css';" />
  <style>
    :root {
      --bg:#0a0f1c; --panel:#0d1526e6; --panel-solid:#0d1526; --panel-2:#101d33;
      --edge:#24406b; --edge-soft:#1b2c4d; --ink:#dfeaff; --ink-dim:#8fb3e0; --ink-faint:#7e9bc4;
      --accent:#00e5ff; --accent-press:#1b8fb0;
      --c-normal:#8fd9ff; --c-renamed:#4dff88; --c-removed:#4a5a72; --c-dup:#ff9f3f; --c-error:#ff5d6c;
      --c-selected:#ffffff;
      --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px;
      --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
      --radius:10px; --radius-sm:6px; --shadow:0 6px 24px #00060f66;
    }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
      font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    #map { position:absolute; inset:0; }
    .panel { position:absolute; background:var(--panel); border:1px solid var(--edge);
      border-radius:var(--radius); padding:10px 12px; backdrop-filter:blur(6px); box-shadow:var(--shadow); z-index:3; }
    .btn { background:#12325c; color:var(--ink); border:1px solid #2e5a90; border-radius:var(--radius-sm);
      padding:5px 10px; cursor:pointer; font-size:var(--fs-sm); transition:.14s; }
    .btn:hover { background:#17457c; border-color:var(--accent); }
    .btn.primary { background:#0e3d4a; border-color:#1f6f82; }
    .btn.primary:hover { background:#12566a; border-color:var(--accent); }
    .btn.danger { background:#3d1414; border-color:#7a2323; }
    .btn.danger:hover { background:#5a1c1c; border-color:#ff5d6c; }
    .btn:disabled { opacity:.4; cursor:default; }
    .btn.small { padding:3px 7px; font-size:var(--fs-xs); }
    input[type=text] { background:#0d1b30; border:1px solid var(--edge); color:var(--ink);
      border-radius:5px; padding:5px 7px; font-size:var(--fs-md); width:100%; box-sizing:border-box; }
    input[type=text]:focus { outline:none; border-color:var(--accent); }

    #topbar { top:12px; left:12px; right:12px; display:flex; flex-wrap:wrap; align-items:center; row-gap:8px; column-gap:14px; padding:8px 14px; }
    #topbar h1 { font-size:var(--fs-lg); margin:0; white-space:nowrap; }
    #topbar .sub { font-size:var(--fs-xs); color:var(--ink-dim); }
    #stats { display:flex; flex-wrap:wrap; gap:10px; font-size:var(--fs-xs); color:var(--ink-dim); margin-left:auto; row-gap:4px; }
    #stats b { color:var(--ink); }
    #topbar .actions { display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; }

    #sidebar { top:64px; left:12px; width:300px; bottom:12px; display:flex; flex-direction:column; padding:10px; }
    #search { margin-bottom:8px; }
    #list { overflow:auto; flex:1; margin:0; padding:0; }
    .zone-group { margin-bottom:4px; }
    .zone-title { font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
      padding:6px 4px 2px; font-weight:600; }
    .pt-row { list-style:none; padding:5px 7px; border-radius:var(--radius-sm); cursor:pointer;
      display:flex; align-items:center; gap:6px; border-left:3px solid var(--c-normal); margin:1px 0; }
    .pt-row:hover { background:var(--edge-soft); }
    .pt-row.sel { background:#123258; }
    .pt-row.removed { opacity:.45; border-left-color:var(--c-removed); text-decoration:line-through; }
    .pt-row.renamed:not(.removed) { border-left-color:var(--c-renamed); }
    .pt-row.dup:not(.removed):not(.renamed) { border-left-color:var(--c-dup); }
    .pt-row.err { border-left-color:var(--c-error); }
    .pt-row .nm { flex:1; font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pt-row .badge { font-size:10px; padding:1px 5px; border-radius:8px; background:var(--edge-soft); color:var(--ink-dim); }

    #editpanel { top:64px; right:12px; width:320px; bottom:12px; overflow:auto; padding:12px; display:none; }
    #editpanel.show { display:block; }
    #editpanel h2 { font-size:var(--fs-md); margin:0 0 2px; }
    #editpanel .field { margin:10px 0; }
    #editpanel label { font-size:var(--fs-xs); color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;
      display:block; margin-bottom:3px; }
    #editpanel .ro { font-size:var(--fs-sm); color:var(--ink-dim); }
    #editpanel .navrow { display:flex; justify-content:space-between; margin-bottom:10px; }
    .flagrow { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
    .flag-pill { font-size:10px; padding:2px 7px; border-radius:8px; }
    .flag-pill.error { background:#3d1414; color:#ff9098; }
    .flag-pill.duplicate { background:#4a2f0d; color:#ffc27a; }
    .flag-pill.cutoff { background:#2a2a10; color:#e8e08a; }
    .sib-list { padding:0; margin:6px 0; }
    .sib { list-style:none; display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:6px; font-size:var(--fs-sm); }
    .sib:hover { background:var(--edge-soft); }
    .sib .snm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
    .removechk { display:flex; align-items:center; gap:7px; margin:10px 0; cursor:pointer; user-select:none; }
    .removechk input { accent-color:var(--c-error); width:15px; height:15px; }
    hr.sep { border:none; border-top:1px solid var(--edge-soft); margin:12px 0; }
    #placeholder { top:64px; right:12px; width:320px; padding:16px; font-size:var(--fs-sm); color:var(--ink-dim); }

    .maplibregl-popup-content { background:var(--panel-solid); color:var(--ink); border:1px solid #2e5a90;
      border-radius:var(--radius-sm); font-size:var(--fs-sm); box-shadow:var(--shadow); }
    .maplibregl-popup-tip { border-top-color:var(--panel-solid) !important; }
    a { color:var(--accent); }
    .hidden { display:none !important; }
    input[type=file] { display:none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="topbar" class="panel">
    <div>
      <h1>Dive Drop-Site Editor</h1>
      <div class="sub">Rename to "&lt;x&gt; Mile - Reef Name", resolve duplicates, export GPX</div>
    </div>
    <div id="stats"></div>
    <div class="actions">
      <button id="btn-export-gpx" class="btn primary">Export GPX</button>
      <button id="btn-export-json" class="btn small">Backup JSON</button>
      <button id="btn-import-json" class="btn small">Restore JSON</button>
      <input type="file" id="file-import" accept=".json" />
      <button id="btn-reset" class="btn small danger">Reset all edits</button>
    </div>
  </div>

  <div id="sidebar" class="panel">
    <input type="text" id="search" placeholder="Filter by name or zone…" />
    <ul id="list"></ul>
  </div>

  <div id="editpanel" class="panel"></div>
  <div id="placeholder" class="panel">Click a point on the map or in the list to rename it.</div>

  <script src="vendor/maplibre-gl.js"
    onerror="var s=document.createElement('script');s.src='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js';s.onload=function(){window.__mlReady&&window.__mlReady()};document.head.appendChild(s);"></script>
  <script type="module" src="dive_site_editor.js"></script>
</body>
</html>
